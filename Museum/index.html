<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wall 控制頁面</title>
  <!-- html5-qrcode CDN removed; using native BarcodeDetector fallback instead -->
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #000;
      color: #f5f5f5;
    }
    .viewer {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .image-box {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .hint {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.88);
      font-size: 0.94rem;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
    }
    .side-button, .overlay-button {
      position: absolute;
      border: none;
      background: transparent;
      color: #f5f5f5;
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .side-button {
      top: 50%;
      transform: translateY(-50%);
      font-size: 2.1rem;
      padding: 36px 42px;
      border-radius: 999px;
      z-index: 20;
    }
    .overlay-button {
      padding: 24px 33px;
      border-radius: 999px;
      font-size: 2.7rem;
      white-space: nowrap;
    }
    .side-button:hover,
    .overlay-button:hover {
      color: #ffcc00;
    }
    #prevBtn {
      left: 16px;
    }
    #nextBtn {
      right: 180px;
    }
    #artBtn {
      bottom: 35%;
      left: 22%;
      transform: translateX(-50%);
    }
    #memoryBtn {
      bottom: 35%;
      left: 48%;
      transform: translateX(-50%);
    }
    #dotBtn {
      bottom: 20%;
      left: 40%;
      transform: translateX(-50%);
    }
    .gallery-overlay {
      position: absolute;
      top: 18%;
      left: 50%;
      transform: translateX(-50%);
      width: 86%;
      display: flex;
      justify-content: space-between;
      gap: 1.5%;
      pointer-events: auto;
    }

    #wall09GoodsOverlay {
      position: absolute;
      inset: 0;
      display: none;
      pointer-events: none;
      z-index: 8;
    }

    /* wall-09 scanner & info panel */
    #wall09Scanner {
      position: absolute;
      right: 18px;
      top: 18px;
      width: 260px;
      height: 220px;
      display: none;
      z-index: 30;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      background: #000;
    }
    #wall09Reader {
      width: 100%;
      height: 100%;
    }
    #wall09ScannerMsg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px;
      color: #fff;
      background: rgba(0,0,0,0.6);
      z-index: 31;
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    #wall09ScannerMsg button {
      padding: 6px 12px; border-radius: 6px; border: none; background: #ffcc00; color: #222; cursor: pointer;
    }

    /* good info panel: image left, text right; wider and slightly scaled up */
    /* good info panel: fixed on viewport (always above museum content) */
    #goodInfoPanel {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(1.2); /* enlarge 20% */
      transform-origin: center center;
      display: none;
      z-index: 9999;
      background: rgba(255,255,255,0.98);
      color: #222;
      padding: 40px;
      border-radius: 16px;
      width: min(980px, 96%); /* slightly wider */
      box-shadow: 0 28px 80px rgba(0,0,0,0.6);
      max-height: 180vh;
      height: 500px;
      align-items: center;
      gap: 28px;
      display: flex;
      flex-direction: row;
      overflow: hidden;
    }
    #goodInfoPanel img { width: 300px; height: 340px; object-fit: cover; border-radius: 12px; flex: 0 0 300px; margin-right: 40px; }
    #goodInfoPanel .info { overflow: hidden; flex: 1 1 auto; min-width: 0; z-index: 2; }
    #goodInfoPanel .info h3 { margin: 0 0 12px 0; font-size: 1.8rem; font-weight: 800; }
    #goodInfoPanel .info p { margin: 0; opacity: 0.95; font-size: 1.12rem; line-height: 1.6; }
    #goodInfoPanel .close { position: absolute; right: 18px; top: 18px; background: transparent; border: none; font-size: 1.9rem; cursor: pointer; color: #222; }
    @media (max-width: 900px) {
      #goodInfoPanel { transform: translate(-50%, -50%) scale(1); width: min(92%, 680px); padding: 20px; flex-direction: column; }
      #goodInfoPanel img { width: 180px; height: 180px; margin-bottom: 12px; }
      #goodInfoPanel .info h3 { font-size: 1.4rem; }
      /* 減少小螢幕上的向上位移，並調整內距 */
      #goodInfoPanel .info { transform: translateY(-10%); padding-left: 20px; }
    }

    #wall09GoodsOverlay .good-item {
      position: absolute;
      width: 8%;
      max-width: 100px;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      border: none;
      border-radius: 12px;
      box-shadow: none;
      background: transparent;
    }

    #wall09GoodsOverlay .good-item img {
      position: static;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #wall09GoodsOverlay .good-item:nth-child(1) { top: 40%; left: 17%; width: 160px; height: 150px; max-width: none; }
    #wall09GoodsOverlay .good-item:nth-child(2) { top: 50%; left: 8%; width: 190px; height: 180px; max-width: none; }
    #wall09GoodsOverlay .good-item:nth-child(3) { top: 58%; left: 35%; width: 180px; height: 150px; max-width: none; }
    #wall09GoodsOverlay .good-item:nth-child(4) { top: 7%; left: 28%; width: 300px; height: 250px; max-width: none; }
    #wall09GoodsOverlay .good-item:nth-child(5) { top: 30%; left: 47%; width: 180px; height: 150px; max-width: none; }
    #wall09GoodsOverlay .good-item:nth-child(6) { top: 56%; left: 51.5%; width: 200px; height: 140px; max-width: none; }
    #wall09GoodsOverlay .good-item:nth-child(7) { top: 38%; left: 78%; width: 150px; height: 150px; max-width: none; }
    #wall09GoodsOverlay .good-item:nth-child(8) { top: 55%; left: 91%; width: 150px; height: 150px; max-width: none; }

    @media (max-width: 1024px) {
      #wall09GoodsOverlay .good-item { width: 120px; height: 150px; }
    }

    @media (max-width: 760px) {
      #wall09GoodsOverlay .good-item { width: 120px; height: 150px; }
      #wall09GoodsOverlay .good-item:nth-child(1) { top: 20%; left: 8%; }
      #wall09GoodsOverlay .good-item:nth-child(2) { top: 44%; left: 8%; }
      #wall09GoodsOverlay .good-item:nth-child(3) { top: 68%; left: 8%; }
      #wall09GoodsOverlay .good-item:nth-child(4) { top: 20%; left: 36%; }
      #wall09GoodsOverlay .good-item:nth-child(5) { top: 20%; left: 50%; }
      #wall09GoodsOverlay .good-item:nth-child(6) { top: 20%; left: 64%; }
      #wall09GoodsOverlay .good-item:nth-child(7) { top: 20%; left: 78%; }
      #wall09GoodsOverlay .good-item:nth-child(8) { top: 58%; left: 78%; }
    }

    /* 交錯排列：wall-04 專用 class */
    .gallery-overlay.alt-rows {
      padding-top: 4%; /* 增加上方空間，避免被裁切 */
      align-items: flex-start;
    }
    .gallery-overlay.alt-rows .gallery-frame {
      transform-origin: center center;
    }
    .gallery-overlay.alt-rows .gallery-frame:nth-child(1),
    .gallery-overlay.alt-rows .gallery-frame:nth-child(3) {
      transform: translateY(-40%) rotate(90deg); /* 第1、3 張上移 40% 並旋轉 90 度 */
    }
    .gallery-overlay.alt-rows .gallery-frame:nth-child(2),
    .gallery-overlay.alt-rows .gallery-frame:nth-child(4) {
      transform: translateY(40%) rotate(90deg); /* 第2、4 張下移 40% 並旋轉 90 度 */
    }
    /* 小螢幕時降低偏移，避免重疊 */
    @media (max-width: 900px) {
      .gallery-overlay.alt-rows .gallery-frame:nth-child(1),
      .gallery-overlay.alt-rows .gallery-frame:nth-child(3) {
        transform: translateY(-20%) rotate(90deg);
      }
      .gallery-overlay.alt-rows .gallery-frame:nth-child(2),
      .gallery-overlay.alt-rows .gallery-frame:nth-child(4) {
        transform: translateY(20%) rotate(90deg);
      }
    }
    .gallery-frame {
      position: relative;
      flex: 1 1 0;
      min-width: 0;
      aspect-ratio: 4 / 3;
      background: rgba(111, 78, 55, 0.08); /* 淺咖啡背景 */
      border: 8px solid #6f4e37; /* 咖啡色相框 */
      box-shadow: 0 14px 26px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }
    .gallery-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .gallery-overlay.alt-rows .gallery-frame img {
      transform: rotate(-90deg) scale(1.43);
      object-fit: contain;
    }
    .gallery-frame::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 2px solid rgba(111, 78, 55, 0.14); /* 輕微咖啡色邊緣 */
      pointer-events: none;
    }
    /* detail-view: image left, text right; wider (+60%) and slightly scaled (+20%) */
    .detail-view {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(1.2);
      transform-origin: center center;
      width: min(1440px, 96%); /* previous ~900 * 1.6 */
      max-height: 84vh;
      display: none;
      gap: 28px;
      z-index: 9998;
      pointer-events: auto;
      align-items: stretch;
      justify-content: flex-start;
      padding: 20px;
      box-shadow: 0 22px 70px rgba(0,0,0,0.65);
      border-radius: 16px;
      background: rgba(8,8,8,0.6);
      overflow: hidden;
      display: flex;
      flex-direction: row;
    }
    .detail-left,
    .detail-right {
      position: relative;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      overflow: hidden;
    }
    .detail-left {
      width: 48%;
      min-width: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .detail-left img {
      width: 100%;
      height: 100%;
      max-height: calc(84vh - 140px);
      object-fit: contain;
      display: block;
    }
    .detail-right {
      width: 52%;
      min-width: 400px;
      padding: 28px;
      color: #f5f5f5;
      display: flex;
      flex-direction: column;
      gap: 18px;
      flex: 1 1 auto;
      min-width: 0;
    }
    @media (max-width: 1100px) {
      .detail-view { transform: translate(-50%, -50%) scale(1); width: min(92%, 920px); flex-direction: column; }
      .detail-left, .detail-right { width: 100%; min-width: 0; }
      .detail-left img { max-height: 420px; }
    }
    .detail-close {
      position: absolute;
      top: 16px;
      right: 16px;
      border: none;
      background: rgba(255, 255, 255, 0.12);
      color: #f5f5f5;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.4rem;
    }
    .detail-title {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.1;
    }
    .detail-artist {
      font-size: 1.2rem;
      opacity: 0.9;
    }
    .detail-description {
      flex: 1;
      font-size: 1rem;
      line-height: 1.7;
      opacity: 0.95;
      white-space: pre-wrap;
    }
    .detail-view.show {
      display: flex;
    }
    .detail-view.hidden {
      display: none;
    }
    .detail-overlay{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,0.35);
      display:none;
      z-index:9;
    }
    .detail-overlay.show{
      display:block;
    }
    .detail-overlay.hide{
      display:none;
    }
    .detail-view button{
      background: rgba(255,255,255,0.12);
    }
    .detail-right .detail-description {
      overflow-y: auto;
    }
    .details-box {
      display: flex;
      gap: 2%;
      width: 100%;
      align-items: stretch;
    }
    .detail-right {
      backdrop-filter: blur(10px);
    }
    .detail-view::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.2);
      pointer-events: none;
      border-radius: 18px;
    }
    .detail-view .detail-right {
      background: rgba(16,16,16,0.85);
    }
    .detail-view .detail-left {
      background: rgba(16,16,16,0.75);
    }
    .detail-right .detail-close {
      background: rgba(255,255,255,0.1);
    }
    .detail-right .detail-close:hover {
      background: rgba(255,255,255,0.18);
    }
    .detail-view .detail-right {
      padding-top: 56px;
    }
    .detail-right .detail-thumbnail {
      display: none;
    }
    .detail-right .detail-title {
      margin-top: 12px;
    }
    .detail-description {
      margin-bottom: 16px;
    }
    .detail-view .detail-left {
      min-height: 100%;
    }
    .detail-right {
      min-height: 100%;
    }
    .detail-right .detail-close {
      position: absolute;
      top: 16px;
      right: 16px;
    }
    .gallery-overlay {
      z-index: 5;
    }
    .detail-view {
      z-index: 12;
    }
    .detail-overlay {
      z-index: 11;
    }
    .detail-right {
      overflow: hidden;
    }
    .detail-right .detail-description {
      max-height: calc(100% - 150px);
    }
    .detail-view .detail-left img {
      border-radius: 0;
    }
    .detail-left, .detail-right {
      box-sizing: border-box;
    }
    .detail-view.hide {
      display: none;
    }
    .detail-view.show {
      display: flex;
    }
    .detail-right {
      justify-content: flex-start;
    }

    .detail-left {
      padding: 16px;
    }
    .detail-right {
      padding: 24px;
    }
    .detail-view {
      /* centered override (kept for safety if duplicated) */
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(900px, 92%);
      max-height: 84vh;
      display: none;
      gap: 24px;
      align-items: stretch;
      z-index: 40;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      border-radius: 16px;
      background: rgba(8,8,8,0.6);
      overflow: hidden;
    }
    .detail-left {
      width: 42%;
      min-width: 40%;
      padding: 16px;
    }
    .detail-right {
      width: 30%;
      min-width: 250px;
      padding: 24px;
    }
    .detail-right .detail-close {
      font-weight: 700;
    }
    .detail-right h1 {
      margin: 0;
    }
    .detail-right h2 {
      margin: 4px 0 16px;
    }
    .detail-right p {
      margin: 0;
    }
    .home-title {
      position: absolute;
      top: 20%;
      left: 35%;
      transform: translateX(-50%);
      color: #f5f5f5;
      font-size: 6rem;
      text-align: center;
      line-height: 1.05;
      letter-spacing: 0.08em;
      text-shadow: 0 0 18px rgba(0, 0, 0, 0.7);
      font-weight: 700;
      white-space: pre-line;
    }
    /* Quick tweak: push text area right to avoid overlap with images */
    #goodInfoPanel .info {
      padding-left: 300px;
      min-width: 0;
      box-sizing: border-box;
      transform: translateY(-30%); /* 向上移動 30% */
    }

    .detail-right {
      padding-left: 300px;
      min-width: 0;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="viewer">
    <div class="image-box">
      <img id="wallImage" src="wall/wall-00.JPG" alt="Wall 00" />
      <div id="homeTitle" class="home-title">陳澄波線上美術館</div>
      <button id="artBtn" class="overlay-button" aria-label="畫作欣賞">畫作欣賞</button>
      <button id="memoryBtn" class="overlay-button" aria-label="物品記憶">物品記憶</button>
      <button id="dotBtn" class="overlay-button" aria-label="點">。</button>
      <div id="galleryOverlay" class="gallery-overlay" style="display:none;">
        <div class="gallery-frame"><img id="frameImg1" src="" alt="Gallery 1"></div>
        <div class="gallery-frame"><img id="frameImg2" src="" alt="Gallery 2"></div>
        <div class="gallery-frame"><img id="frameImg3" src="" alt="Gallery 3"></div>
        <div class="gallery-frame"><img id="frameImg4" src="" alt="Gallery 4"></div>
      </div>
      <div id="wall09GoodsOverlay">
        <div class="good-item"><img src="goods/good-001.png" alt="Good 1"></div>
        <div class="good-item"><img src="goods/good-002.png" alt="Good 2"></div>
        <div class="good-item"><img src="goods/good-003.png" alt="Good 3"></div>
        <div class="good-item"><img src="goods/good-004.png" alt="Good 4"></div>
        <div class="good-item"><img src="goods/good-005.png" alt="Good 5"></div>
        <div class="good-item"><img src="goods/good-006.png" alt="Good 6"></div>
        <div class="good-item"><img src="goods/good-007.png" alt="Good 7"></div>
        <div class="good-item"><img src="goods/good-008.png" alt="Good 8"></div>
      </div>

      <!-- wall-09 scanner preview (hidden until wall-09) -->
      <div id="wall09Scanner"><div id="wall09Reader"></div><div id="wall09ScannerMsg"><div id="wall09ScannerMsgText"></div><button id="wall09ScannerRetry" onclick="startWall09Scanner()">重試</button></div></div>

      <!-- good info panel shown after scan -->
      <div id="goodInfoPanel">
        <button class="close" onclick="hideGoodInfo()">×</button>
        <img id="goodInfoImg" src="" alt="Good">
        <div class="info">
          <h3 id="goodInfoTitle">物品名稱</h3>
          <p id="goodInfoText">說明文字...</p>
        </div>
      </div>

      <div id="detailOverlay" class="detail-overlay"></div>
      <div id="detailView" class="detail-view" aria-hidden="true">
        <div class="detail-left"><img id="detailImg" src="" alt="Detail"></div>
        <div class="detail-right">
          <button id="detailClose" class="detail-close" aria-label="關閉">×</button>
          <h1 id="detailTitle" class="detail-title">Title</h1>
          <h2 id="detailArtist" class="detail-artist">Artist</h2>
          <p id="detailDescription" class="detail-description">Description</p>
        </div>
      </div>
      <button id="prevBtn" class="side-button" aria-label="上一張">←</button>
      <button id="nextBtn" class="side-button" aria-label="下一張">→</button>
      <div class="hint">請按上方按鈕進入下一頁</div>
    </div>
  </div>

  <script>
    const imageEl = document.getElementById('wallImage');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const artBtn = document.getElementById('artBtn');
    const memoryBtn = document.getElementById('memoryBtn');
    const dotBtn = document.getElementById('dotBtn');
    const homeTitle = document.getElementById('homeTitle');
    const galleryOverlay = document.getElementById('galleryOverlay');
    const frameImg1 = document.getElementById('frameImg1');
    const frameImg2 = document.getElementById('frameImg2');
    const frameImg3 = document.getElementById('frameImg3');
    const frameImg4 = document.getElementById('frameImg4');
    const detailOverlay = document.getElementById('detailOverlay');
    const detailView = document.getElementById('detailView');
    const wall09GoodsOverlay = document.getElementById('wall09GoodsOverlay');
    const detailImg = document.getElementById('detailImg');
    const detailTitle = document.getElementById('detailTitle');
    const detailArtist = document.getElementById('detailArtist');
    const detailDescription = document.getElementById('detailDescription');
    const detailClose = document.getElementById('detailClose');

    const paintingInfo = {
      1: { title: '月夜', artist: '陳澄波', description: '。' },
      2: { title: '鄉間小路', artist: '陳澄波', description: '。' },
      3: { title: '花園', artist: '陳澄波', description: '。' },
      4: { title: '山水', artist: '陳澄波', description: '。' },
      5: { title: '古街', artist: '陳澄波', description: '。' },
      6: { title: '港邊', artist: '陳澄波', description: '。' },
      7: { title: '樹影', artist: '陳澄波', description: '。' },
      8: { title: '春景', artist: '陳澄波', description: '。' },
      9: { title: '田園', artist: '陳澄波', description: '。' },
      10: { title: '古樸', artist: '陳澄波', description: '。' },
      11: { title: '幽徑', artist: '陳澄波', description: '。' },
      12: { title: '市井', artist: '陳澄波', description: '。' },
      13: { title: '館藏', artist: '陳澄波', description: '。' },
    };

    // ===== wall-09 scanner & goods mapping =====
    let wall09QrScanner = null;
    let wall09ScannerRunning = false;
    let wall09ScannerMode = null; // 'html5' or 'barcode'
    // BarcodeDetector fallback state
    let wall09VideoStream = null;
    let wall09VideoEl = null;
    let wall09BarcodeDetector = null;
    let wall09BarcodeLoop = null;

    // QR -> good id mapping (QR code content expected to be '1'..'8')
    const qrToGood = {
      '1': 'M01', '2': 'M02', '3': 'M03', '4': 'M04',
      '5': 'M05', '6': 'M06', '7': 'M07', '8': 'M08'
    };

    // Optional display info for goods
    const goodsInfo = {
      'M01': { title: 'Good 001', text: '說明 001' },
      'M02': { title: 'Good 002', text: '說明 002' },
      'M03': { title: 'Good 003', text: '說明 003' },
      'M04': { title: 'Good 004', text: '說明 004' },
      'M05': { title: 'Good 005', text: '說明 005' },
      'M06': { title: 'Good 006', text: '說明 006' },
      'M07': { title: 'Good 007', text: '說明 007' },
      'M08': { title: 'Good 008', text: '說明 008' }
    };

    async function initWall09Scanner() {
      // prefer html5-qrcode if available
      if (window.Html5Qrcode && !wall09QrScanner) {
        console.log('[Scanner] Using html5-qrcode');
        wall09QrScanner = new Html5Qrcode('wall09Reader');
        wall09ScannerMode = 'html5';
        return;
      }
      if (!window.Html5Qrcode) {
        console.warn('[Scanner] html5-qrcode not available (likely blocked by Tracking Prevention)');
      }
      
      // fallback: use BarcodeDetector if available
      if ('BarcodeDetector' in window && !wall09BarcodeDetector) {
        try {
          console.log('[Scanner] Checking BarcodeDetector support...');
          const formats = await BarcodeDetector.getSupportedFormats();
          console.log('[Scanner] Supported formats:', formats);
          if (formats.includes('qr_code')) {
            wall09BarcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });
            wall09ScannerMode = 'barcode';
            console.log('[Scanner] BarcodeDetector initialized for QR code');
          } else {
            console.warn('[Scanner] BarcodeDetector does not support qr_code');
          }
        } catch (e) {
          console.warn('[Scanner] BarcodeDetector error:', e.message);
          wall09BarcodeDetector = null;
        }
      } else if (!('BarcodeDetector' in window)) {
        console.warn('[Scanner] BarcodeDetector not available in this browser');
      }
    }

    async function startWall09Scanner() {
      if (wall09ScannerRunning) return;
      hideScannerMessage();
      // ensure init
      await initWall09Scanner();
      
      if (wall09ScannerMode === 'html5' && wall09QrScanner) {
        console.log('[Scanner] Starting html5-qrcode mode');
        const config = { fps: 10, qrbox: { width: 200, height: 200 } };
        wall09QrScanner.start(
          { facingMode: 'environment' },
          config,
          onWall09ScanSuccess
        ).then(() => {
          wall09ScannerRunning = true;
          const s = document.getElementById('wall09Scanner'); if (s) s.style.display = 'block';
          hideScannerMessage();
          console.log('[Scanner] html5-qrcode started successfully');
        }).catch(err => {
          console.error('[Scanner] html5-qrcode start failed:', err);
          const msg = (err && err.name === 'NotAllowedError') ? '無法存取相機：請允許相機權限' : '啟動相機失敗，請檢查裝置或權限';
          showScannerMessage(msg, true);
        });
        return;
      }

      // BarcodeDetector fallback
      if (wall09ScannerMode === 'barcode' && wall09BarcodeDetector) {
        console.log('[Scanner] Starting BarcodeDetector mode');
        const reader = document.getElementById('wall09Reader');
        // create video element
        if (!wall09VideoEl) {
          wall09VideoEl = document.createElement('video');
          wall09VideoEl.setAttribute('playsinline', '');
          wall09VideoEl.autoplay = true;
          wall09VideoEl.muted = true;
          wall09VideoEl.style.width = '100%';
          wall09VideoEl.style.height = '100%';
          reader.appendChild(wall09VideoEl);
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
          wall09VideoStream = stream;
          wall09VideoEl.srcObject = stream;
          await wall09VideoEl.play();
          wall09ScannerRunning = true;
          const s = document.getElementById('wall09Scanner'); if (s) s.style.display = 'block';
          hideScannerMessage();
          console.log('[Scanner] BarcodeDetector started successfully');
          // start detection loop
          const loop = async () => {
            if (!wall09ScannerRunning || !wall09VideoEl) return;
            try {
              const results = await wall09BarcodeDetector.detect(wall09VideoEl);
              if (results && results.length) {
                const v = results[0].rawValue || (results[0].value ? results[0].value : null);
                if (v) onWall09ScanSuccess(v, results[0]);
              }
            } catch (e) {
              // detection may throw if frame not ready
            }
            wall09BarcodeLoop = requestAnimationFrame(loop);
          };
          wall09BarcodeLoop = requestAnimationFrame(loop);
        } catch (err) {
          console.error('[Scanner] BarcodeDetector start failed:', err);
          const msg = (err && err.name === 'NotAllowedError') ? '無法存取相機：請允許相機權限' : '啟動相機失敗，請檢查裝置或權限';
          showScannerMessage(msg, true);
        }
        return;
      }

      // no available scanner implementation
      const errorMsg = `無法初始化掃描器。
html5-qrcode: ${window.Html5Qrcode ? '✓' : '✗'}
BarcodeDetector: ${'BarcodeDetector' in window ? '✓' : '✗'}
mode: ${wall09ScannerMode || 'none'}`;
      console.error('[Scanner]', errorMsg);
      showScannerMessage('無法啟動掃描器，請確認瀏覽器支援相機掃描並允許相機權限。', false);
    }

    function stopWall09Scanner() {
      if (!wall09ScannerRunning) return;
      if (wall09ScannerMode === 'html5' && wall09QrScanner) {
        wall09QrScanner.stop().then(() => {
          wall09ScannerRunning = false;
          const s = document.getElementById('wall09Scanner'); if (s) s.style.display = 'none';
          hideScannerMessage();
        }).catch(err => {
          console.warn('wall09 scanner stop failed (html5-qrcode)', err);
        });
        return;
      }
      if (wall09ScannerMode === 'barcode') {
        // stop detection loop
        if (wall09BarcodeLoop) cancelAnimationFrame(wall09BarcodeLoop);
        wall09BarcodeLoop = null;
        // stop video
        if (wall09VideoStream) {
          wall09VideoStream.getTracks().forEach(t => t.stop());
          wall09VideoStream = null;
        }
        if (wall09VideoEl && wall09VideoEl.parentElement) {
          wall09VideoEl.parentElement.removeChild(wall09VideoEl);
        }
        wall09VideoEl = null;
        wall09ScannerRunning = false;
        const s = document.getElementById('wall09Scanner'); if (s) s.style.display = 'none';
        hideScannerMessage();
        return;
      }
      hideScannerMessage();
    }

    function showScannerMessage(text, showRetry) {
      const msg = document.getElementById('wall09ScannerMsg');
      const msgText = document.getElementById('wall09ScannerMsgText');
      const retry = document.getElementById('wall09ScannerRetry');
      if (msgText) msgText.textContent = text || '';
      if (retry) retry.style.display = showRetry ? 'inline-block' : 'none';
      if (msg) msg.style.display = 'flex';
      const s = document.getElementById('wall09Scanner'); if (s) s.style.display = 'block';
    }

    function hideScannerMessage() {
      const msg = document.getElementById('wall09ScannerMsg');
      if (msg) msg.style.display = 'none';
      const s = document.getElementById('wall09Scanner'); if (s && !wall09ScannerRunning) s.style.display = 'none';
    }

    // 相機測試工具：在 Console 呼叫 testWall09Camera()，或用於未來的 UI 按鈕
    function testWall09Camera() {
      showScannerMessage('正在測試相機⋯⋯（Console 也會顯示詳情）', true);
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showScannerMessage('此瀏覽器不支援 getUserMedia()', false);
        console.warn('getUserMedia not supported');
        return;
      }
      navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
        console.log('getUserMedia success', stream);
        showScannerMessage('相機可用：已取得串流（稍後自動停止）', false);
        // 立即停止以免占用相機
        stream.getTracks().forEach(t => t.stop());
        setTimeout(hideScannerMessage, 1200);
      }).catch(err => {
        console.error('getUserMedia failed', err);
        const name = err && err.name ? err.name : 'Error';
        const msg = (err && err.message) ? err.message : String(err);
        showScannerMessage('相機測試失敗：' + name + ' — ' + msg, true);
      });
    }

    function onWall09ScanSuccess(decodedText, decodedResult) {
      const id = String(decodedText).trim();
      if (qrToGood[id]) {
        // pause scanner depending on mode
        try {
          if (wall09ScannerMode === 'html5' && wall09QrScanner && wall09QrScanner.pause) wall09QrScanner.pause(true);
          if (wall09ScannerMode === 'barcode') {
            // stop detection but keep stream (we stop fully on hide)
            if (wall09BarcodeLoop) cancelAnimationFrame(wall09BarcodeLoop);
            wall09BarcodeLoop = null;
          }
        } catch(e) { /* ignore */ }
        showGoodInfo(qrToGood[id]);
      }
    }

    function showGoodInfo(goodId) {
      const img = document.getElementById('goodInfoImg');
      const title = document.getElementById('goodInfoTitle');
      const text = document.getElementById('goodInfoText');
      if (img) img.src = `memory/${goodId}.PNG`;
      const info = goodsInfo[goodId] || { title: goodId, text: '' };
      if (title) title.textContent = info.title;
      if (text) text.textContent = info.text;
      // hide wall goods overlay to avoid visual overlap
      try {
        window._wall09GoodsWasVisible = window._wall09GoodsWasVisible || (document.getElementById('wall09GoodsOverlay') && document.getElementById('wall09GoodsOverlay').style.display !== 'none');
        const goods = document.getElementById('wall09GoodsOverlay'); if (goods) goods.style.display = 'none';
      } catch(e){}
      const panel = document.getElementById('goodInfoPanel');
      if (panel) panel.style.display = 'flex';
    }

    function hideGoodInfo() {
      const panel = document.getElementById('goodInfoPanel');
      if (panel) panel.style.display = 'none';
      try {
        // restore goods overlay if it was visible before
        const goods = document.getElementById('wall09GoodsOverlay');
        if (goods && window._wall09GoodsWasVisible) goods.style.display = 'block';
        window._wall09GoodsWasVisible = false;
        if (wall09ScannerMode === 'html5' && wall09QrScanner && wall09QrScanner.resume) wall09QrScanner.resume();
        if (wall09ScannerMode === 'barcode' && !wall09BarcodeLoop && wall09VideoEl) {
          // restart detection loop
          wall09ScannerRunning = true;
          const loop = async () => {
            if (!wall09ScannerRunning || !wall09VideoEl) return;
            try {
              const results = await wall09BarcodeDetector.detect(wall09VideoEl);
              if (results && results.length) {
                const v = results[0].rawValue || (results[0].value ? results[0].value : null);
                if (v) onWall09ScanSuccess(v, results[0]);
              }
            } catch (e) {}
            wall09BarcodeLoop = requestAnimationFrame(loop);
          };
          wall09BarcodeLoop = requestAnimationFrame(loop);
        }
      } catch(e) { /* ignore */ }
    }

    function formatWall(index) {
      return `wall-${String(index).padStart(2, '0')}.JPG`;
    }

    const hintEl = document.querySelector('.hint');

    // 定義實際存在且允許瀏覽的頁面索引，跳過已刪除的 wall-06/wall-07
    const pages = [0, 1, 2, 3, 4, 5, 8, 9];
    let currentPos = 0; // pages[currentPos] 為目前實際顯示的牆面編號

    function updateView() {
      const currentIndex = pages[currentPos];
      const filename = formatWall(currentIndex);
      imageEl.src = `wall/${filename}`;
      imageEl.alt = `Wall ${String(currentIndex).padStart(2, '0')}`;
      const isHome = currentIndex === 0;
      const isSpecialPage = currentIndex === 1 || currentIndex === 8;
      prevBtn.style.display = isHome ? 'none' : 'block';
      nextBtn.style.display = isHome ? 'none' : 'block';
      artBtn.style.display = isHome ? 'block' : 'none';
      memoryBtn.style.display = isHome ? 'block' : 'none';
      dotBtn.style.display = isHome ? 'block' : 'none';
      homeTitle.style.display = isHome ? 'block' : 'none';
      const galleryPages = {
        2: [1, 2, 3],
        3: [4, 5, 6],
        4: [7, 8, 9, 10],
        5: [11, 12, 13],
      };
      const pageFrames = galleryPages[currentIndex] || [];
      const hasGallery = pageFrames.length > 0;
      const isWall09 = currentIndex === 9;
      galleryOverlay.style.display = isWall09 ? 'none' : hasGallery ? 'flex' : 'none';
      wall09GoodsOverlay.style.display = isWall09 ? 'block' : 'none';
      if (isWall09) {
        // 延遲 500ms 啟動，讓 UI 先渲染；並先顯示初始化訊息
        showScannerMessage('正在初始化相機...', false);
        setTimeout(() => {
          startWall09Scanner();
        }, 500);
      } else {
        stopWall09Scanner();
        hideGoodInfo();
        // 確保離開 wall-09 時隱藏所有相關元素
        const scanner = document.getElementById('wall09Scanner');
        const goodPanel = document.getElementById('goodInfoPanel');
        if (scanner) scanner.style.display = 'none';
        if (goodPanel) goodPanel.style.display = 'none';
      }
      // 針對 wall-04 使用交錯排列 class
      if (currentIndex === 4) {
        galleryOverlay.classList.add('alt-rows');
      } else {
        galleryOverlay.classList.remove('alt-rows');
      }
      if (hasGallery && !isWall09) {
        const frameImages = [frameImg1, frameImg2, frameImg3, frameImg4];
        frameImages.forEach((imgEl, index) => {
          if (pageFrames[index] != null) {
            imgEl.src = `painting/${String(pageFrames[index]).padStart(3, '0')}.jpg`;
            imgEl.parentElement.style.display = 'block';
          } else {
            imgEl.src = '';
            imgEl.parentElement.style.display = 'none';
          }
        });
        galleryOverlay.style.width = pageFrames.length === 2 ? '55%' : pageFrames.length === 4 ? '92%' : '86%';
      } else {
        detailView.classList.remove('show');
        detailOverlay.classList.remove('show');
      }
      nextBtn.style.right = isSpecialPage ? '30%' : '16px';
      nextBtn.style.top = isSpecialPage ? '35%' : '50%';
      hintEl.textContent = isHome
        ? '請按上方按鈕進入下一頁'
        : '使用鍵盤左右鍵或左右按鈕切換';
    }

    function showPrevious() {
      if (pages[currentPos] === 0) return;
      currentPos = (currentPos - 1 + pages.length) % pages.length;
      updateView();
    }

    function showNext() {
      currentPos = (currentPos + 1) % pages.length;
      updateView();
    }

    function showDetail(id) {
      const info = paintingInfo[id] || { title: `畫作 ${id}`, artist: '未知', description: '此畫作尚無介紹。' };
      detailImg.src = `painting/${String(id).padStart(3, '0')}.jpg`;
      detailTitle.textContent = info.title;
      detailArtist.textContent = info.artist;
      detailDescription.textContent = info.description;
      detailView.classList.add('show');
      detailOverlay.classList.add('show');
      detailView.setAttribute('aria-hidden', 'false');
    }

    function closeDetail() {
      detailView.classList.remove('show');
      detailOverlay.classList.remove('show');
      detailView.setAttribute('aria-hidden', 'true');
    }

    prevBtn.addEventListener('click', showPrevious);
    nextBtn.addEventListener('click', showNext);
    artBtn.addEventListener('click', () => {
      const p = pages.indexOf(1);
      currentPos = p >= 0 ? p : 0;
      updateView();
    });
    memoryBtn.addEventListener('click', () => {
      const p = pages.indexOf(8);
      currentPos = p >= 0 ? p : pages.length - 1;
      updateView();
    });
    detailClose.addEventListener('click', closeDetail);
    detailOverlay.addEventListener('click', closeDetail);
    [frameImg1, frameImg2, frameImg3, frameImg4].forEach((imgEl, index) => {
      imgEl.addEventListener('click', () => {
        const currentIndex = pages[currentPos];
        const pageFrames = {
          2: [1, 2, 3],
          3: [4, 5, 6],
          4: [7, 8, 9, 10],
          5: [11, 12, 13],
        }[currentIndex] || [];
        const id = pageFrames[index];
        if (id) showDetail(id);
      });
    });

    window.addEventListener('keydown', (event) => {
      if (pages[currentPos] === 0) return;
      if (event.key === 'ArrowLeft') {
        showPrevious();
      } else if (event.key === 'ArrowRight') {
        showNext();
      }
    });

    updateView();
  </script>
</body>
</html>
